name: feedthebet

x-php: &php
  build:
    context: ./docker/php
  volumes:
    - ./backend:/var/www/backend
  depends_on:
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend:ro
    depends_on:
      - php
      - node

  php:
    <<: *php

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  node:
    build:
      context: ./docker/node
    volumes:
      - ./frontend:/var/www/frontend
      - node-modules:/var/www/frontend/node_modules

volumes:
  redis-data:
  node-modules:
