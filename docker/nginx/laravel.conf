# Laravel (API + Auth0 routes), included by the dev and prod server blocks.
# php-fpm resolves SCRIPT_FILENAME in its own container, so the PHP files need not exist in nginx.
location ~ ^/(api|login|callback|logout)(/|$) {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_X_FORWARDED_HOST $forwarded_host;
    fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_read_timeout 60s;
}
